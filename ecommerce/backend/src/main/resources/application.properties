spring.application.name=ecommerce
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Base64-encoded key (>= 256 bits). Override with JWT_SECRET in real deployments.
app.jwt.secret=${JWT_SECRET:Q2hhbmdlVGhpc1NlY3JldEtleUJlZm9yZVByb2R1Y3Rpb24tMDEyMzQ1Njc4OS1BQkNERUY=}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html
